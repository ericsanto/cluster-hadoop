services:

  worker:

    build: 
      context: ..
      dockerfile: worker/Dockerfile.worker

    container_name: worker

    
    network_mode: "host"
    volumes:
     - ../ssh:/home/hadoop/.ssh
     - ../workers.txt:/home/hadoop/hadoop/etc/hadoop/workers


    
  node-exporter-worker:

    image: prom/node-exporter

    network_mode: service:worker